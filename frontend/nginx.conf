# =============================================================================
# PH Agent Hub — Frontend Nginx Configuration
# =============================================================================
# Serves the Vite production build and proxies /api requests to the backend.
# Used inside the frontend Docker container.
# =============================================================================

server {
    listen 3000;
    server_name localhost;

    client_max_body_size 100m;

    # ── Static files ───────────────────────────────────────────────────────
    root /usr/share/nginx/html;
    index index.html;

    # Gzip
    gzip on;
    gzip_types text/plain text/css application/json application/javascript image/svg+xml;
    gzip_min_length 256;

    # ── PWA manifest & service worker ─────────────────────────────────────
    # Never cache these — stale manifest is the #1 cause of missing PWA icons
    # Also force correct MIME type — nginx:alpine lacks webmanifest in mime.types
    location ~ ^/manifest\.webmanifest$ {
        types { }  # Clear inherited types, then set just what we need
        default_type application/manifest+json;
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
        add_header Pragma "no-cache" always;
    }
    location ~ ^/(sw\.js|workbox-.*\.js)$ {
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
        add_header Pragma "no-cache" always;
    }

    # ── Static assets (don't SPA-fallback — prevents registerSW.js HTML bug) --
    location ~* \.(js|css|svg|png|ico|jpg|jpeg|gif|webmanifest|woff|woff2|ttf|eot)$ {
        try_files $uri =404;
        expires 1h;
        add_header Cache-Control "public, max-age=3600";
    }

    # ── SPA routing ────────────────────────────────────────────────────────
    location / {
        try_files $uri $uri/ /index.html;
    }

    # ── API proxy ──────────────────────────────────────────────────────────
    location /api/ {
        proxy_pass http://backend:8000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
        proxy_buffering off;  # Required for SSE streaming
    }

    # ── Security headers ───────────────────────────────────────────────────
    # CSP frame-ancestors allows embedding the widget iframe on external sites.
    # The WIDGET_ALLOWED_ORIGINS placeholder is substituted at container startup.
    add_header Content-Security-Policy "frame-ancestors __WIDGET_ALLOWED_ORIGINS__" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
}
