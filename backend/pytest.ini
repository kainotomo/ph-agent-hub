# =============================================================================
# PH Agent Hub — Pytest Configuration
# =============================================================================
# Markers:
#   unit        — Fast, no external services (pure logic)
#   integration — Requires DB/Redis via conftest fixtures (default)
#   e2e         — Requires full Docker stack (Docker Compose up)
#   slow        — Tests that take > 5 seconds
#   live_api    — Tests that call real external APIs (require credentials)
# =============================================================================

[pytest]
asyncio_mode = auto
testpaths = tests
python_files = test_*.py
markers =
    unit: Pure logic tests (no DB, no network)
    integration: Tests requiring DB/Redis via fixtures
    e2e: Requires full Docker Compose stack
    slow: Tests that take more than 5 seconds
    live_api: Calls real external APIs (requires credentials)
addopts =
    --tb=short
    --strict-markers
