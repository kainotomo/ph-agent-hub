<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="360" viewBox="0 0 1400 360" role="img" aria-labelledby="title desc">
  <title id="title">PH Agent Hub banner</title>
  <desc id="desc">Banner showing dual UI and multi-tenant AI platform positioning.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="60%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#334155"/>
    </linearGradient>
    <linearGradient id="card" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0b1220"/>
      <stop offset="100%" stop-color="#111827"/>
    </linearGradient>
  </defs>

  <rect width="1400" height="360" fill="url(#bg)" rx="20"/>

  <rect x="42" y="42" width="760" height="276" rx="16" fill="url(#card)" stroke="#475569" stroke-width="1"/>

  <text x="72" y="110" font-family="Segoe UI, Arial, sans-serif" font-size="46" fill="#e2e8f0" font-weight="700">PH Agent Hub</text>
  <text x="72" y="148" font-family="Segoe UI, Arial, sans-serif" font-size="20" fill="#cbd5e1">Multi-tenant AI platform with a dual UI model</text>

  <rect x="72" y="184" width="158" height="42" rx="10" fill="#0ea5e9"/>
  <text x="95" y="211" font-family="Segoe UI, Arial, sans-serif" font-size="18" fill="#f8fafc" font-weight="600">Chat Area</text>

  <rect x="244" y="184" width="172" height="42" rx="10" fill="#22c55e"/>
  <text x="271" y="211" font-family="Segoe UI, Arial, sans-serif" font-size="18" fill="#f8fafc" font-weight="600">Admin Area</text>

  <rect x="430" y="184" width="246" height="42" rx="10" fill="#f59e0b"/>
  <text x="454" y="211" font-family="Segoe UI, Arial, sans-serif" font-size="18" fill="#111827" font-weight="700">Tenant Isolation</text>

  <text x="72" y="264" font-family="Segoe UI, Arial, sans-serif" font-size="16" fill="#94a3b8">FastAPI + Microsoft Agent Framework + React + Docker</text>

  <rect x="850" y="70" width="500" height="220" rx="18" fill="#0b1220" stroke="#475569"/>
  <text x="888" y="116" font-family="Segoe UI, Arial, sans-serif" font-size="24" fill="#e2e8f0" font-weight="700">First 10-second takeaways</text>
  <text x="888" y="154" font-family="Segoe UI, Arial, sans-serif" font-size="17" fill="#cbd5e1">1. End-user chat and admin controls in one app</text>
  <text x="888" y="184" font-family="Segoe UI, Arial, sans-serif" font-size="17" fill="#cbd5e1">2. Multi-tenant by design, not an afterthought</text>
  <text x="888" y="214" font-family="Segoe UI, Arial, sans-serif" font-size="17" fill="#cbd5e1">3. Ready to run locally with Docker Compose</text>
  <text x="888" y="244" font-family="Segoe UI, Arial, sans-serif" font-size="17" fill="#cbd5e1">4. Includes demo flow and embeddable widget</text>
</svg>
