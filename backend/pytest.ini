# =============================================================================
# PH Agent Hub — Pytest Configuration
# =============================================================================

[pytest]
asyncio_mode = auto
# pytest-asyncio >= 1.0: the removed session-scoped ``event_loop`` fixture is
# replaced by explicit loop scopes. The DB engine/pool is created at import time
# and must stay on one loop for the whole session, otherwise fixtures fail with
# "Future attached to a different loop".
asyncio_default_test_loop_scope = session
asyncio_default_fixture_loop_scope = session
testpaths = tests
python_files = test_*.py
markers =
    background_tasks: Tests for background tasks and notifications
    unit: Pure logic tests (no DB, no network)
    integration: Tests requiring DB/Redis via fixtures
    e2e: Requires full Docker Compose stack
    slow: Tests that take more than 5 seconds
    live_api: Calls real external APIs (requires credentials)
    security: Tests for authentication, authorization, and security boundaries
    regression: Tests tied to previously identified bug patterns
